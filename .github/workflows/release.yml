name: Build & Release Multi-Platform Binaries

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: spoiberia
            artifact_name: spoiberia-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: spoiberia.exe
            artifact_name: spoiberia-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: spoiberia
            artifact_name: spoiberia-macos-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run unit tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare dist artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: release-artifacts
        run: |
          chmod +x spoiberia-linux-x86_64 spoiberia-macos-aarch64 || true
          sha256sum spoiberia-* > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" release-artifacts/* \
              --repo "${{ github.repository }}" \
              --title "SPOIberia $TAG" \
              --generate-notes
          fi
