[package]
name = "spoiberia"
version = "0.9.1"
edition = "2021"
description = "SharePoint Online Management, Provisioning & Cloning — TUI & Agent-Ready CLI in Rust"
authors = ["Javier Novella <fnovella@gmail.com>"]
license = "MIT"

[[bin]]
name = "spoiberia"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.28"
crossterm = "0.28"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
url = "2.5"
urlencoding = "2.1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
open = "5.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
